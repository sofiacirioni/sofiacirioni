name: Generate Snake

# Genera la animación "snake" que recorre y se come tu grid de actividad,
# con puntos en tono celeste (como las nubes) y la serpiente en azul de acento.
# Se publica en la rama `output` y el README la referencia desde ahí.

on:
  schedule:
    - cron: "0 */12 * * *" # cada 12 h, refresca con tu actividad reciente
  push:
    branches: [main]
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%230f1fff&color_dots=%23e8edff,%237d9dff,%235d7cff,%233a5bff,%230f1fff
            dist/snake-dark.svg?palette=github-dark&color_snake=%237d9dff&color_dots=%23161b22,%232a3a66,%234a63b3,%236a8bff,%237d9dff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
